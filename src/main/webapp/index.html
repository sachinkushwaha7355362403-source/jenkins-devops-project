<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: #174ea6;
            color: white;
            padding: 25px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 12px #cccccc;
        }

        h2 {
            color: #174ea6;
        }

        p {
            color: #444444;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            background: #174ea6;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }

        .button:hover {
            background: #0d3475;
        }

        footer {
            margin-top: 40px;
            color: #666666;
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Feedback Portal</h1>
        <p>Your feedback helps us improve education.</p>
    </header>

    <div class="container">
        <h2>Welcome, Students!</h2>

        <p>
            Share your valuable feedback about teaching,
            courses, and your learning experience.
        </p>

        <p>Your opinion matters to us.</p>

        <a href="feedback" class="button">Submit Feedback</a>
    </div>

    <footer>
        <p>Student Feedback Portal | DevOps CI/CD Project</p>
    </footer>

</body>
</html>
